name: Weekly Report - Every Monday

# PROTOCOLO §9: reporte semanal cada lunes. Lunes 13:23 UTC (08:23 en Lima, antes de la apertura).
# El martes corre de respaldo: si el lunes ya se envio, no hace nada (data/report_state.json).
on:
  schedule:
    - cron: '23 13 * * 1'
    - cron: '23 13 * * 2'
  workflow_dispatch:
    inputs:
      week:
        description: 'Lunes de la semana a reportar (AAAA-MM-DD). Vacio = ultima semana completa'
        required: false
        default: ''
      force:
        description: 'Reenviar aunque ya se haya enviado'
        type: boolean
        default: false

# Usa los datos que deja el monitor (señales, velas y operaciones) y solo escribe reports/ y
# data/report_state.json: asi nunca choca al hacer push con los commits del monitor.
permissions:
  contents: write

concurrency:
  group: senales-weekly
  cancel-in-progress: false

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send weekly report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python scripts/6_generate_weekly_report.py ${WEEK:+--week "$WEEK"} $FORCE

      - name: Commit & push changes
        if: ${{ !cancelled() }}
        run: |
          git config user.email "signal-bot@${GITHUB_SERVER_URL##*/}.invalid"
          git config user.name "Signal Bot"
          git add reports data/report_state.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Auto: reporte semanal $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
