name: Weekly Report - Every Friday at 4 PM ET

# Ejecuta cada viernes a las 4:00 PM ET (8:00/9:00 PM UTC según EDT/EST)
on:
  schedule:
    # Viernes 8:20 PM UTC (cubre EDT)
    - cron: '20 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Weekly Report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/6_generate_weekly_report.py

      - name: Commit & push changes
        run: |
          git config user.email "signal-bot@${GITHUB_SERVER_URL##*/}.invalid"
          git config user.name "Signal Bot"
          git add reports data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Auto: reporte semanal $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
