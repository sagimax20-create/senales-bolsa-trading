name: Signal Monitor - Every 15 Minutes

# PROTOCOLO §7: captura cada 15 min, 24/7 (Telegram no duerme). Los scripts de precios y de
# Gravity Zone deciden solos si corresponde (horario NYSE, feriados). Minutos 7/22/37/52 en vez
# de :00/:15/:30/:45: GitHub retrasa o salta mas las corridas en punto. Aun asi GitHub no
# garantiza la frecuencia; por eso Telegram se lee por cursor (no se pierde ningun mensaje) y los
# precios se completan con velas de 15 min (no se pierde ningun tramo).
# Repo publico: los minutos de Actions no tienen costo.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      reprocess:
        description: 'Releer y reprocesar todos los mensajes desde capture_start'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: senales-pipeline
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cada paso corre aunque el anterior falle (un script caido no detiene el pipeline);
      # el job queda en rojo solo si un script falla de verdad.
      - name: 0 - Update US symbol list (weekly)
        run: python scripts/0_update_symbols.py

      - name: 1 - Parse Telegram signals
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          REPROCESS: ${{ github.event_name == 'workflow_dispatch' && inputs.reprocess && '1' || '' }}
        run: python scripts/1_parser_signals.py

      - name: 2 - Gravity Zone alerts
        if: ${{ !cancelled() }}
        run: python scripts/2_gravity_alerts.py

      - name: 3 - Fetch price bars
        if: ${{ !cancelled() }}
        run: python scripts/3_fetch_prices.py

      - name: 4 - Calculate paper operations
        if: ${{ !cancelled() }}
        run: python scripts/4_calculate_returns.py

      - name: 5 - Milestones and alerts
        if: ${{ !cancelled() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scripts/5_generate_reports.py

      # Avisos al bot de Telegram (+25/+50/+75/+100%). Sin estos Secrets no hace nada.
      - name: 6 - Telegram bot alerts
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/8_notify_telegram.py

      - name: Commit & push changes
        if: ${{ !cancelled() }}
        run: |
          git config user.email "signal-bot@${GITHUB_SERVER_URL##*/}.invalid"
          git config user.name "Signal Bot"
          git add data reports
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Auto: captura de señales $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
